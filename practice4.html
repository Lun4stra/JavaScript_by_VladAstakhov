<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Практична робота №4</title>
</head>
<body>

<h1>JavaScript. Практична робота №4</h1>
<p>Результати у консолі браузера.</p>

<script>
function ucFirst(str) {
    if (!str) return str; 
    return str[0].toUpperCase() + str.slice(1);
}

console.log(ucFirst("вася"));
console.log(ucFirst("hello"));

function checkSpam(str) {
    let lowerStr = str.toLowerCase();
    return lowerStr.includes("росі") || lowerStr.includes("xxx");
}

console.log(checkSpam("buy ViAgRA now"));
console.log(checkSpam("XXX free"));
console.log(checkSpam("Слава росії"));

function truncate(str, maxlength) {
    if (str.length > maxlength) {
        return str.slice(0, maxlength - 1) + "…";
    }
    return str;
}

console.log(truncate("Оце, що мені хотілося б сказати на цю тему:", 20));
console.log(truncate("Короткий текст", 20));

function strikeStr(str) {
    let words = str.split(" ");
    let result = "";

    for (let i = 0; i < words.length; i++) {
        result += words[i] + " ";
            
        if ((i + 1) % 3 === 0) {
            result += "\n";
        }
    }

    return result.trim();
}

console.log(strikeStr("JavaScript це дуже цікава мова програмування для навчання"));
</script>

</body>
</html>
