<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Практична робота №1</title>
</head>
<body>

<h1>JavaScript. Практична робота №1</h1>

<script>
let login = prompt("Введіть логін:");

if (login === "Admin") {
    let password = prompt("Введіть пароль:");

    if (password === "12345") {
        alert("Ласкаво просимо!");
    } else if (password === "" || password === null) {
        alert("Скасовано");
    } else {
        alert("Неправильний пароль");
    }

} else if (login === "" || login === null) {
    alert("Скасовано");
} else {
    alert("Я вас не знаю");
}
</script>

</body>
</html>
